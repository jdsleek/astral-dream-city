<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral Dream City — Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0320;color:#fff;min-height:100vh}
header{background:rgba(255,255,255,0.04);border-bottom:1px solid rgba(200,149,42,0.2);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;background:linear-gradient(135deg,#F0C44A,#C8952A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-right{display:flex;align-items:center;gap:12px}
#liveTag{background:rgba(16,185,129,0.15);color:#34D399;border:1px solid rgba(16,185,129,0.3);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600}
#refreshBtn{background:rgba(200,149,42,0.15);color:#F0C44A;border:1px solid rgba(200,149,42,0.3);padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
#refreshBtn:hover{background:rgba(200,149,42,0.25)}

.stats{display:flex;gap:12px;padding:20px 24px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,0.05);border:1px solid rgba(200,149,42,0.12);border-radius:14px;padding:16px 20px;min-width:130px}
.stat-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:#F0C44A}
.stat-label{font-size:12px;color:rgba(255,255,255,0.45);margin-top:3px}

.filters{padding:0 24px 16px;display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{padding:7px 16px;border-radius:99px;border:1.5px solid rgba(255,255,255,0.12);background:transparent;color:rgba(255,255,255,0.55);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.filter-btn:hover,.filter-btn.active{background:rgba(200,149,42,0.2);border-color:rgba(200,149,42,0.5);color:#F0C44A}

.orders{padding:0 24px 40px;display:flex;flex-direction:column;gap:12px}
.order-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:18px 20px;transition:border-color 0.2s}
.order-card:hover{border-color:rgba(200,149,42,0.3)}
.order-card.status-ready{border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.04)}
.order-card.status-done{opacity:0.5}
.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.order-id{font-size:11px;color:rgba(255,255,255,0.3);font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.order-name{font-size:16px;font-weight:700;color:#fff;margin-top:2px}
.order-phone{font-size:13px;color:rgba(255,255,255,0.45);margin-top:2px}
.order-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta-chip{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.5)}
.meta-chip.time{background:rgba(200,149,42,0.12);color:#F0C44A}
.status-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;white-space:nowrap}
.s-new{background:rgba(59,130,246,0.15);color:#93C5FD;border:1px solid rgba(59,130,246,0.3)}
.s-ready{background:rgba(16,185,129,0.15);color:#34D399;border:1px solid rgba(16,185,129,0.3)}
.s-done{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.08)}
.order-items{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.order-item{font-size:13px;color:rgba(255,255,255,0.65);display:flex;justify-content:space-between;gap:8px}
.order-item span:last-child{color:rgba(200,149,42,0.8);font-weight:600;white-space:nowrap}
.order-total{font-size:15px;font-weight:700;color:#F0C44A;padding-top:10px;border-top:1px solid rgba(255,255,255,0.07);display:flex;justify-content:space-between}
.order-note{margin-top:8px;font-size:12px;color:rgba(255,255,255,0.35);font-style:italic}
.order-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act-btn{padding:7px 16px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid;font-family:'Inter',sans-serif;transition:all 0.2s}
.act-ready{border-color:rgba(16,185,129,0.4);color:#34D399;background:rgba(16,185,129,0.08)}
.act-ready:hover{background:rgba(16,185,129,0.2)}
.act-done{border-color:rgba(255,255,255,0.12);color:rgba(255,255,255,0.4);background:transparent}
.act-done:hover{background:rgba(255,255,255,0.08)}
.act-new{border-color:rgba(59,130,246,0.4);color:#93C5FD;background:rgba(59,130,246,0.08)}
.act-new:hover{background:rgba(59,130,246,0.18)}
.order-at{font-size:11px;color:rgba(255,255,255,0.2);margin-top:6px}

#empty{text-align:center;padding:80px 20px;color:rgba(255,255,255,0.25)}
#empty p{font-size:16px;margin-top:12px}

@media(max-width:480px){
  .stats{gap:8px}
  .stat{min-width:100px;padding:12px 14px}
  .stat-val{font-size:22px}
  .orders{padding:0 16px 40px}
  .filters{padding:0 16px 16px}
  header{padding:12px 16px}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">✦ Astral Orders</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px">BASA 2026 · Admin View</div>
  </div>
  <div class="header-right">
    <div id="liveTag">● Live</div>
    <button id="refreshBtn" onclick="load()">↻ Refresh</button>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-label">Total Orders</div></div>
  <div class="stat"><div class="stat-val" id="s-new">0</div><div class="stat-label">New</div></div>
  <div class="stat"><div class="stat-val" id="s-ready">0</div><div class="stat-label">Ready</div></div>
  <div class="stat"><div class="stat-val" id="s-done">0</div><div class="stat-label">Done</div></div>
  <div class="stat"><div class="stat-val" id="s-revenue">₦0</div><div class="stat-label">Revenue</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('new',this)">🔵 New</button>
  <button class="filter-btn" onclick="setFilter('ready',this)">🟢 Ready</button>
  <button class="filter-btn" onclick="setFilter('done',this)">✅ Done</button>
</div>

<div class="orders" id="orders"></div>

<script>
let allOrders = [];
let currentFilter = 'all';

function fmt(n){ return '₦' + Number(n||0).toLocaleString(); }
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  return Math.floor(s/3600) + 'h ago';
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});
}

async function load(){
  try{
    const res = await fetch('/api/orders');
    const data = await res.json();
    allOrders = data.orders || [];
    render();
  } catch(e){
    document.getElementById('orders').innerHTML = '<div id="empty"><div style="font-size:40px">⚠️</div><p>Could not load orders. Is the server running?</p></div>';
  }
}

async function setStatus(id, status){
  await fetch(`/api/orders/${id}/status`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({status})
  }).catch(()=>{});
  const o = allOrders.find(o => o.id === id);
  if(o) o.status = status;
  render();
}

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);

  // Stats
  document.getElementById('s-total').textContent = allOrders.length;
  document.getElementById('s-new').textContent = allOrders.filter(o=>o.status==='new').length;
  document.getElementById('s-ready').textContent = allOrders.filter(o=>o.status==='ready').length;
  document.getElementById('s-done').textContent = allOrders.filter(o=>o.status==='done').length;
  document.getElementById('s-revenue').textContent = fmt(allOrders.reduce((s,o)=>s+(o.total||0),0));

  const el = document.getElementById('orders');
  if(!filtered.length){
    el.innerHTML = `<div id="empty"><div style="font-size:48px">🛍️</div><p>${currentFilter==='all'?'No orders yet — they will appear here as they come in.':'No '+currentFilter+' orders.'}</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(o => {
    const badgeClass = {new:'s-new',ready:'s-ready',done:'s-done'}[o.status]||'s-new';
    const badgeLabel = {new:'🔵 New',ready:'🟢 Ready to collect',done:'✅ Done'}[o.status]||o.status;
    const items = (o.items||[]).map(i =>
      `<div class="order-item"><span>${i.n} ×${i.q}</span><span>${fmt(i.p*i.q)}</span></div>`
    ).join('');
    const actions = o.status === 'new'
      ? `<button class="act-btn act-ready" onclick="setStatus(${o.id},'ready')">Mark Ready →</button>
         <button class="act-btn act-done" onclick="setStatus(${o.id},'done')">Mark Done</button>`
      : o.status === 'ready'
      ? `<button class="act-btn act-done" onclick="setStatus(${o.id},'done')">✓ Mark Done</button>
         <button class="act-btn act-new" onclick="setStatus(${o.id},'new')">Back to New</button>`
      : `<button class="act-btn act-new" onclick="setStatus(${o.id},'new')">Reopen</button>`;

    return `<div class="order-card status-${o.status}">
      <div class="order-head">
        <div>
          <div class="order-id">#${o.id} · ${fmtTime(o.at)}</div>
          <div class="order-name">${o.name}</div>
          <div class="order-phone">${o.phone}</div>
        </div>
        <div class="order-meta">
          ${o.time && o.time!=='Not specified'?`<div class="meta-chip time">⏰ ${o.time}</div>`:''}
          <div class="status-badge ${badgeClass}">${badgeLabel}</div>
        </div>
      </div>
      <div class="order-items">${items}</div>
      <div class="order-total"><span>Total</span><span>${fmt(o.total)}</span></div>
      ${o.note?`<div class="order-note">📝 ${o.note}</div>`:''}
      <div class="order-actions">${actions}</div>
      <div class="order-at">${timeAgo(o.at)}</div>
    </div>`;
  }).join('');
}

// Auto-refresh every 10 seconds
load();
setInterval(load, 10000);
</script>
</body>
</html>
